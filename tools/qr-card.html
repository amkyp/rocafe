<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کارت QR منو</title>
<link rel="stylesheet" href="../assets/css/fonts.css">
<style>
  *{box-sizing:border-box;margin:0}
  body{font-family:RoPlex,Tahoma,sans-serif;background:#f2f2ef;color:#18181b;padding:1.5rem 1rem}
  form{max-width:440px;margin:0 auto 1.5rem;display:flex;gap:.5rem}
  input{flex:1;min-width:0;height:44px;border:1px solid #d6d6d0;border-radius:10px;padding:0 .8rem;font:inherit;direction:ltr}
  input:focus{outline:2px solid #18181b;outline-offset:1px}
  button{height:44px;padding:0 1.2rem;border:0;border-radius:10px;background:#18181b;color:#fff;font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.4;cursor:default}
  .sheet{display:flex;flex-wrap:wrap;gap:6mm;justify-content:center}
  .card{width:105mm;height:148mm;background:#fff;display:flex;flex-direction:column;align-items:center;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .head{width:100%;background:#18181b;height:28mm;display:grid;place-items:center}
  .head svg{width:24mm}
  h1{font-size:18pt;margin-top:auto}
  .sub{font-size:11pt;color:#66666d;margin-top:1mm}
  .qr{width:66mm;margin-top:5mm}          /* quiet zone is drawn inside the SVG */
  .qr svg{display:block;width:100%;height:auto}
  .url{margin:2mm 0 auto;font-size:9pt;color:#66666d;direction:ltr}
  @page{size:A4;margin:8mm}
  @media print{
    body{background:#fff;padding:0}
    form{display:none}
    .sheet{gap:4mm}
    .card{width:95mm;height:134mm;box-shadow:none;border:.2mm dashed #ccc;break-inside:avoid}
    h1{margin-top:7mm}
  }
</style>
</head>
<body>
<form id="f">
  <input id="url" type="url" required placeholder="https://rocafe.ir" aria-label="آدرس منو">
  <button id="go" disabled>چاپ</button>
</form>
<div class="sheet" id="sheet"></div>

<script src="qrcode.js"></script>
<script>
const LOGO = '<svg viewBox="0 0 150 100" aria-hidden="true"><path d="M10 92 35 9l27 38-22 4 26 41" fill="none" stroke="#f2c230" stroke-width="13" stroke-linecap="square"/><rect x="92" y="34" width="38" height="38" transform="rotate(45 111 53)" fill="none" stroke="#f2c230" stroke-width="12"/></svg>';

// QR as one SVG path, with the 4-module quiet zone the QR standard asks for.
function qrSvg(text){
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), Q = 4; let d = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) d += `M${x+Q} ${y+Q}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n+2*Q} ${n+2*Q}" shape-rendering="crispEdges" role="img" aria-label="QR"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
const card = url => `<section class="card"><div class="head">${LOGO}</div><h1>کافه رو</h1><p class="sub">منو</p><div class="qr">${qrSvg(url)}</div><p class="url">${url.replace(/^https?:\/\//,'').replace(/\/$/,'')}</p></section>`;

const el = document.getElementById('url'), go = document.getElementById('go'), sheet = document.getElementById('sheet');
function build(){
  const ok = el.checkValidity() && /^https?:\/\/[^/\s]+\.[^/\s]+/.test(el.value.trim());
  go.disabled = !ok;
  sheet.innerHTML = ok ? card(el.value.trim()).repeat(4) : '';
}
if (location.protocol.startsWith('http')) el.value = location.href.replace(/tools\/qr-card\.html.*$/, '');
el.addEventListener('input', build);
document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); build(); if (!go.disabled) print(); });
build();
</script>
</body>
</html>
